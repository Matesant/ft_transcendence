server {
	listen 8080 ssl;
	listen [::]:8080 ssl;

	server_name _;
	root /app/public;
	index index.html;

	ssl_certificate_key /app/server.key;
	ssl_certificate /app/server.crt;

	# Upload de avatar aceita 10 MB no user-service; o padrão do nginx é 1 MB.
	client_max_body_size 10m;

	# DNS interno do Docker. Resolver em tempo de requisição (via variável no
	# proxy_pass) evita que o nginx morra no boot se um serviço ainda não subiu.
	resolver 127.0.0.11 valid=10s ipv6=off;

	# Certificados dos serviços são self-signed, assinados pela CA local.
	proxy_ssl_verify off;

	proxy_http_version 1.1;
	# $http_host e não $host: $host descarta a porta, e os serviços montam URLs
	# absolutas a partir deste header (avatares, redirect do Google).
	proxy_set_header Host $http_host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto https;

	location /auth/ {
		set $auth_service https://auth-service:3001;
		proxy_pass $auth_service$request_uri;
	}

	# Sem barra final: atende tanto /match quanto /match/next.
	location /match {
		set $match_service https://match-service:3002;
		proxy_pass $match_service$request_uri;
	}

	location /users/ {
		set $user_service https://user-service:3003;
		proxy_pass $user_service$request_uri;
	}

	# ^~ é obrigatório: sem ele o location regex de extensões abaixo tem
	# precedência e os avatares (.jpeg/.png) nunca chegariam ao user-service.
	location ^~ /uploads/ {
		set $user_service https://user-service:3003;
		proxy_pass $user_service$request_uri;
	}

	# Exato, para não capturar a rota /player da SPA.
	location = /players {
		set $user_service https://user-service:3003;
		proxy_pass $user_service$request_uri;
	}

	# Com barra final, para não capturar a rota /game da SPA.
	location /games/ {
		set $game_service https://game-service:3004;
		proxy_pass $game_service$request_uri;
	}

	location /ws {
		set $game_service https://game-service:3004;
		proxy_pass $game_service$request_uri;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}

	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
		expires 6M;
		access_log off;
		log_not_found off;
	}

	# SPA: qualquer outra rota devolve o index.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
