# Config do web-proxy da 42 para o ft_transcendence.
# Destino: /etc/nginx/sites-available/expo3.conf  (+ symlink em sites-enabled/)
#
# Todo o roteamento por rota mora no nginx do container (frontend/nginx.conf),
# então aqui basta repassar tudo para a VM sem reescrever o path.
#
# Requisitos no host:
#   - `map $http_upgrade $connection_upgrade` no http{} (já usado pelo reservation.conf)
#   - nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name expo3.42sp.org.br;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name expo3.42sp.org.br;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_ciphers "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH EDH+aRSA !RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS";
    ssl_prefer_server_ciphers on;

    ssl_certificate /etc/ssl/42sp.org.br.chain.crt;
    ssl_certificate_key /etc/ssl/42sp.org.br.key;

    # Upload de avatar: 10 MB (o padrão do nginx é 1 MB).
    client_max_body_size 10m;

    location / {
        # A VM serve HTTPS com certificado self-signed, daí o https:// e o verify off.
        proxy_pass https://10.51.4.88:8080;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        # Host preservado byte a byte: os serviços montam URLs absolutas a partir
        # dele (URLs de avatar e o redirect_uri do login com Google). $host
        # descartaria a porta, $http_host repassa o header original.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket do jogo (/ws) passa por aqui.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
