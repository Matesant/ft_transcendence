# nginx.conf corrigido para o projeto do grupo cshingai (expo2).
# Montado por volume sobre /etc/nginx/nginx.conf, sem editar o arquivo do grupo.
#
# Duas correções em relação ao original, ambas necessárias para rodar no Linux
# com o perfil prod:
#
# 1. proxy_pass https:// (era http://). O perfil prod liga TLS no Spring
#    (server.ssl.enabled=true em application-prod.properties), então HTTP contra
#    a porta 8080 do backend não completa o handshake.
#    proxy_ssl_verify off porque o keystore é autoassinado.
#
# 2. Barra final no proxy_pass (era sem). Os controllers Kotlin ficam em /auth,
#    /users, /profile, /friends, /presence — sem prefixo /api. Sem a barra o
#    nginx repassa /api/auth/login e o backend devolve 404; com a barra ele
#    repassa /auth/login.
#
# Também troca o `Connection 'upgrade'` fixo por um map condicional: mandar
# Connection: upgrade em toda requisição HTTP comum não é correto.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # O redirect do Spring para o Google traz um Location enorme (client_id,
    # scope, state, nonce, PKCE) junto de cookies de sessão, e estoura os buffers
    # padrão de 4k: o nginx responde 502 com "upstream sent too big header".
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Cache static assets
        location ~* ^/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Serve index.html for client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Proxy API requests to backend
        location /api/ {
            proxy_pass https://backend:8080/;
            proxy_ssl_verify off;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        # Fluxo OAuth2 do Google. Estes caminhos são acessados pelo BROWSER e
        # ficam fora de /api/, porque o backend não sabe que esse prefixo existe
        # — todo redirect que ele emite sai sem ele. Sem estes três location, o
        # fluxo cai na SPA e morre no primeiro passo.
        #
        #   /oauth2/authorization/google        -> para onde /api/auth/oauth2/
        #                                          authorize/google redireciona
        #   /login/oauth2/code/google           -> callback do Google
        #                                          (é o redirect_uri gerado)
        #   /auth/oauth2/authorize/google/...   -> defaultSuccessUrl e failure
        #
        # Sem barra final no proxy_pass: o path é preservado como o Spring espera.
        location /oauth2/ {
            proxy_pass https://backend:8080;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /login/oauth2/ {
            proxy_pass https://backend:8080;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/oauth2/ {
            proxy_pass https://backend:8080;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
