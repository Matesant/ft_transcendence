# Vhosts expo1..expo4.42sp.org.br no web-proxy da 42.
# Destino: /etc/nginx/sites-available/expo.conf  (+ symlink em sites-enabled/)
#
# Segue a estrutura do reservation.conf: cada server block é autocontido, com
# seus próprios ssl_certificate. Sem includes/snippets — a máquina é gerida por
# Ansible e arquivo fora do layout esperado some no próximo run.
#
# Um server block por hostname. Vários hostnames NÃO exigem vários arquivos: o
# nginx concatena sites-enabled/*, então um arquivo com N blocks e N arquivos com
# um block cada produzem exatamente o mesmo resultado.
#
# Requisito no http{}: map $http_upgrade $connection_upgrade { ... }
# (o reservation.conf já usa $connection_upgrade, então existe)
#
# As quatro instâncias vivem na VM 10.51.4.88, em portas distintas. Cada uma já
# roteia por rota internamente (nginx próprio), então aqui é um location /
# repassando tudo, sem reescrever path.
#
# ATENÇÃO ao esquema, que difere por projeto:
#   expo1 -> https://10.51.4.88:8091   nginx do grupo serve TLS na 443
#   expo2 -> http://10.51.4.88:8092    nginx do grupo serve HTTP puro na 80
#   expo3 -> https://10.51.4.88:8080   nosso nginx serve TLS na 8080
#   expo4 -> http://10.51.4.88:8094    nginx serve HTTP puro na 80
# Onde é http://, o TLS termina aqui no proxy e o salto interno fica na rede da
# 42 — mesmo padrão do reservation.conf, que usa http:// em todos os upstreams.

server {
    listen 80;
    listen [::]:80;
    server_name expo1.42sp.org.br expo2.42sp.org.br expo3.42sp.org.br expo4.42sp.org.br;
    # $host, não $server_name: com vários nomes no mesmo block, $server_name
    # devolve sempre o PRIMEIRO da lista e mandaria expo2 para expo1.
    return 301 https://$host$request_uri;
}

# --------------------------------------------------------------------- expo1
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name expo1.42sp.org.br;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_ciphers "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH EDH+aRSA !RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS";
    ssl_prefer_server_ciphers on;

    ssl_certificate /etc/ssl/42sp.org.br.chain.crt;
    ssl_certificate_key /etc/ssl/42sp.org.br.key;

    client_max_body_size 20m;

    location / {
        proxy_pass https://10.51.4.88:8091;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets deste projeto: /pong-ws/, /match-ws/ e /socket.io/.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

