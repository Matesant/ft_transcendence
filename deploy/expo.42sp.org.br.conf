# Vhosts expo*.42sp.org.br no web-proxy da 42.
# Destino: /etc/nginx/sites-available/expo.conf  (+ symlink em sites-enabled/)
#
# Segue a estrutura do reservation.conf: cada server block é autocontido, com
# seus próprios ssl_certificate. Sem includes/snippets — a máquina é gerida por
# Ansible e arquivo fora do layout esperado some no próximo run.
#
# Um server block por hostname. Vários hostnames NÃO exigem vários arquivos:
# o nginx concatena sites-enabled/*, então um arquivo com N blocks e N arquivos
# com um block cada produzem exatamente o mesmo resultado.
#
# Requisito no http{}: map $http_upgrade $connection_upgrade { ... }
# (o reservation.conf já usa $connection_upgrade, então existe)
#
# Diferenças em relação ao reservation.conf, todas necessárias aqui:
#   - proxy_pass https:// (a VM serve TLS) + proxy_ssl_verify off (self-signed)
#   - Host $http_host em vez de $host: preserva a porta, e os serviços montam
#     URLs absolutas a partir desse header (avatares e redirect_uri do Google)
#   - client_max_body_size 10m: upload de avatar (o padrão do nginx é 1 MB)
#   - Upgrade/Connection no location /: o WebSocket do jogo fica em /ws, que
#     cai sob / porque o roteamento por rota mora no nginx do container
#   - um location / só: o container roteia /auth, /match, /users, /uploads,
#     /players, /games, /ws e a SPA internamente

# Redirect HTTP -> HTTPS.
# Usa $host, não $server_name: com vários nomes no mesmo block, $server_name
# devolve sempre o PRIMEIRO da lista e mandaria expo2 para expo1.
server {
    listen 80;
    listen [::]:80;
    server_name expo1.42sp.org.br expo2.42sp.org.br expo3.42sp.org.br expo4.42sp.org.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name expo3.42sp.org.br;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_ciphers "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH EDH+aRSA !RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS";
    ssl_prefer_server_ciphers on;

    # Wildcard *.42sp.org.br cobre todos os expoN.
    ssl_certificate /etc/ssl/42sp.org.br.chain.crt;
    ssl_certificate_key /etc/ssl/42sp.org.br.key;

    client_max_body_size 10m;

    location / {
        proxy_pass https://10.51.4.88:8080;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# --------------------------------------------------------------------------
# expo1 / expo2 / expo4: descomente quando cada instância existir e ajuste o
# proxy_pass. Enquanto não houver backend na porta, o vhost responde 502.
