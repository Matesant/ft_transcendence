# Vhosts expo*.42sp.org.br no web-proxy da 42.
# Destino: /etc/nginx/sites-available/expo.conf  (+ symlink em sites-enabled/)
#
# Segue a estrutura do reservation.conf: cada server block é autocontido, com
# seus próprios ssl_certificate. Sem includes/snippets — a máquina é gerida por
# Ansible e arquivo fora do layout esperado some no próximo run.
#
# Um server block por hostname. Vários hostnames NÃO exigem vários arquivos:
# o nginx concatena sites-enabled/*, então um arquivo com N blocks e N arquivos
# com um block cada produzem exatamente o mesmo resultado.
#
# Requisito no http{}: map $http_upgrade $connection_upgrade { ... }
# (o reservation.conf já usa $connection_upgrade, então existe)
#
# Todas as instâncias vivem na VM 10.51.4.88, em portas distintas:
#   expo1 -> 8091  (grupo jopereir)   ATIVO
#   expo2 -> 8092  (grupo cshingai)   pendente
#   expo3 -> 8080  (nosso)            ATIVO
#   expo4 -> 8094                     pendente
#
# Cada instância já roteia por rota internamente (nginx/api-gateway próprios),
# então aqui é um location / repassando tudo, sem reescrever path.

server {
    listen 80;
    listen [::]:80;
    server_name expo1.42sp.org.br expo2.42sp.org.br expo3.42sp.org.br expo4.42sp.org.br;
    # $host, não $server_name: com vários nomes no mesmo block, $server_name
    # devolve sempre o PRIMEIRO da lista e mandaria expo2 para expo1.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name expo1.42sp.org.br;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_ciphers "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH EDH+aRSA !RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS";
    ssl_prefer_server_ciphers on;

    ssl_certificate /etc/ssl/42sp.org.br.chain.crt;
    ssl_certificate_key /etc/ssl/42sp.org.br.key;

    client_max_body_size 20m;

    location / {
        proxy_pass https://10.51.4.88:8091;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSockets deste projeto: /pong-ws/, /match-ws/ e /socket.io/.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name expo3.42sp.org.br;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    ssl_ciphers "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH EDH+aRSA !RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS";
    ssl_prefer_server_ciphers on;

    ssl_certificate /etc/ssl/42sp.org.br.chain.crt;
    ssl_certificate_key /etc/ssl/42sp.org.br.key;

    # Upload de avatar: 10 MB (padrão do nginx é 1 MB).
    client_max_body_size 10m;

    location / {
        # A VM serve HTTPS com certificado self-signed, daí o https:// e o verify off.
        proxy_pass https://10.51.4.88:8080;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        # Host preservado byte a byte: os serviços montam URLs absolutas a partir
        # dele (URLs de avatar e o redirect_uri do login com Google). $host
        # descartaria a porta, $http_host repassa o header original.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket do jogo (/ws) passa por aqui.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

